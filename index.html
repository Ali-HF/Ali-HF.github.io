const hist = [];
let hi = 0;

function run(line) {
  print('ali@karachi:~$ ' + line, 'dim');
  const [cmd, ...rest] = line.trim().split(/\s+/);
  if (!cmd) return;
  hist.push(line);
  hi = hist.length;
  if (commands[cmd]) commands[cmd](rest.join(' '));
  else print(`${cmd}: command not found. type 'help'.`);
}

input.addEventListener('keydown', e => {
  if (e.key === 'Enter') { run(input.value); input.value = ''; }
  else if (e.key === 'ArrowUp') { if (hi > 0) input.value = hist[--hi]; e.preventDefault(); }
  else if (e.key === 'ArrowDown') { input.value = hist[++hi] || ''; e.preventDefault(); }
  else if (e.key === 'Tab') {
    e.preventDefault();
    const m = Object.keys(commands).filter(c => c.startsWith(input.value));
    if (m.length === 1) input.value = m[0];
  }
});
document.addEventListener('click', () => input.focus());

function startSnakeGame() {
  if (currentGame) return;
  currentGame = 'snake';
  
  const gameDiv = document.createElement('div');
  gameDiv.className = 'line';
  gameDiv.style.margin = '16px 0';
  gameDiv.innerHTML = `
    <div style="background:#161b22; border:2px solid #30363d; border-radius:6px; padding:12px; max-width:440px; margin:0 auto; box-shadow:0 0 15px rgba(126,231,135,0.15);">
      <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #30363d; padding-bottom:8px; margin-bottom:8px; font-size:18px;">
        <span style="color:#7ee787; font-weight:bold;">🐾 RETRO ARCADE SNAKE</span>
        <span style="font-size:16px;">SCORE: <span id="snk-score" style="color:#aff5b4;">0</span> | HIGH: <span id="snk-high" style="color:#7ee787;">0</span></span>
        <button id="snk-quit-btn" style="background:#21262d; border:1px solid #30363d; color:#8b949e; cursor:pointer; font-family:inherit; padding:2px 8px; font-size:16px; border-radius:4px;">[Q] QUIT</button>
      </div>
      <canvas id="snk-canvas" width="400" height="300" style="display:block; background:#0d1117; border:1px solid #21262d; border-radius:4px; margin:0 auto;"></canvas>
      <div style="margin-top:10px; display:flex; justify-content:space-between; align-items:center; font-size:16px; color:#8b949e;">
        <span>Controls: <b>Arrow Keys</b> or <b>W A S D</b> | <b>SPACE</b> to restart</span>
      </div>
      <div style="margin-top:8px; display:flex; justify-content:center; gap:6px;">
        <button class="dpad-btn" data-dir="up" style="background:#21262d; border:1px solid #30363d; color:#7ee787; width:44px; height:36px; border-radius:4px; cursor:pointer; font-size:18px;">▲</button>
      </div>
      <div style="margin-top:4px; display:flex; justify-content:center; gap:6px;">
        <button class="dpad-btn" data-dir="left" style="background:#21262d; border:1px solid #30363d; color:#7ee787; width:44px; height:36px; border-radius:4px; cursor:pointer; font-size:18px;">◀</button>
        <button class="dpad-btn" data-dir="down" style="background:#21262d; border:1px solid #30363d; color:#7ee787; width:44px; height:36px; border-radius:4px; cursor:pointer; font-size:18px;">▼</button>
        <button class="dpad-btn" data-dir="right" style="background:#21262d; border:1px solid #30363d; color:#7ee787; width:44px; height:36px; border-radius:4px; cursor:pointer; font-size:18px;">▶</button>
      </div>
    </div>
  `;
  out.appendChild(gameDiv);
  window.scrollTo(0, document.body.scrollHeight);

  const canvas = document.getElementById('snk-canvas');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('snk-score');
  const highEl = document.getElementById('snk-high');
  const quitBtn = document.getElementById('snk-quit-btn');

  let highScore = parseInt(localStorage.getItem('ali_snk_high') || '0', 10);
  highEl.textContent = highScore;

  const GRID = 20;
  const COLS = canvas.width / GRID; // 20
  const ROWS = canvas.height / GRID; // 15

  let snake = [
    { x: 10, y: 7 },
    { x: 9, y: 7 },
    { x: 8, y: 7 }
  ];
  let dir = { x: 1, y: 0 };
  let nextDir = { x: 1, y: 0 };
  let food = spawnFood();
  let score = 0;
  let gameOver = false;
  let loopId = null;

  function spawnFood() {
    let pos;
    while (!pos || snake.some(s => s.x === pos.x && s.y === pos.y)) {
      pos = {
        x: Math.floor(Math.random() * COLS),
        y: Math.floor(Math.random() * ROWS)
      };
    }
    return pos;
  }

  function tick() {
    if (gameOver) return;

    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    // Wall collision (wrap around or collide - arcade wall collision)
    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
      endGame();
      return;
    }

    // Self collision
    if (snake.some(s => s.x === head.x && s.y === head.y)) {
      endGame();
      return;
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score += 10;
      scoreEl.textContent = score;
      if (score > highScore) {
        highScore = score;
        highEl.textContent = highScore;
        localStorage.setItem('ali_snk_high', highScore);
      }
      food = spawnFood();
    } else {
      snake.pop();
    }

    render();
  }

  function render() {
    // Clear canvas
    ctx.fillStyle = '#0d1117';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Subtle grid lines
    ctx.strokeStyle = '#161b22';
    ctx.lineWidth = 1;
    for (let x = 0; x <= canvas.width; x += GRID) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
    }
    for (let y = 0; y <= canvas.height; y += GRID) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
    }

    // Food (glowing fish / orb)
    ctx.fillStyle = '#aff5b4';
    ctx.beginPath();
    ctx.arc(food.x * GRID + GRID / 2, food.y * GRID + GRID / 2, GRID / 2 - 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#7ee787';
    ctx.beginPath();
    ctx.arc(food.x * GRID + GRID / 2, food.y * GRID + GRID / 2, GRID / 4, 0, Math.PI * 2);
    ctx.fill();

    // Snake with multi-tone green gradient!
    const colors = ['#aff5b4', '#7ee787', '#3fb950', '#2ea043', '#238636', '#1b4727'];
    snake.forEach((seg, i) => {
      const col = colors[Math.min(i, colors.length - 1)];
      ctx.fillStyle = col;
      
      // Draw rounded segment
      const r = i === 0 ? 5 : 3;
      ctx.beginPath();
      ctx.roundRect(seg.x * GRID + 1, seg.y * GRID + 1, GRID - 2, GRID - 2, r);
      ctx.fill();

      // Draw cute cat ears/eyes on head!
      if (i === 0) {
        ctx.fillStyle = '#010409';
        // Eye positions based on direction
        const ex1 = seg.x * GRID + 5;
        const ex2 = seg.x * GRID + 13;
        const ey = seg.y * GRID + 6;
        ctx.fillRect(ex1, ey, 2, 3);
        ctx.fillRect(ex2, ey, 2, 3);
      }
    });

    if (gameOver) {
      ctx.fillStyle = 'rgba(13, 17, 23, 0.85)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#ff7b72';
      ctx.font = '28px VT323, monospace';
      ctx.textAlign = 'center';
      ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 15);

      ctx.fillStyle = '#7ee787';
      ctx.font = '20px VT323, monospace';
      ctx.fillText(`SCORE: ${score} - PRESS SPACE TO RESTART`, canvas.width / 2, canvas.height / 2 + 15);
      ctx.fillText(`OR PRESS Q TO QUIT TO TERMINAL`, canvas.width / 2, canvas.height / 2 + 40);
    }
  }

  function endGame() {
    gameOver = true;
    clearInterval(loopId);
    render();
  }

  function restart() {
    snake = [
      { x: 10, y: 7 },
      { x: 9, y: 7 },
      { x: 8, y: 7 }
    ];
    dir = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    food = spawnFood();
    score = 0;
    scoreEl.textContent = score;
    gameOver = false;
    clearInterval(loopId);
    loopId = setInterval(tick, 100);
    render();
  }

  function handleKey(e) {
    if (currentGame !== 'snake') return;

    if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') {
      if (dir.y === 0) nextDir = { x: 0, y: -1 };
      e.preventDefault();
    } else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') {
      if (dir.y === 0) nextDir = { x: 0, y: 1 };
      e.preventDefault();
    } else if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
      if (dir.x === 0) nextDir = { x: -1, y: 0 };
      e.preventDefault();
    } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
      if (dir.x === 0) nextDir = { x: 1, y: 0 };
      e.preventDefault();
    } else if (e.key === ' ' || e.code === 'Space') {
      if (gameOver) restart();
      e.preventDefault();
    } else if (e.key === 'q' || e.key === 'Q' || e.key === 'Escape') {
      quitGame();
      e.preventDefault();
    }
  }

  function quitGame() {
    clearInterval(loopId);
    window.removeEventListener('keydown', handleKey);
    currentGame = null;
    print('Arcade snake closed. Back at terminal prompt.', 'dim');
    input.focus();
  }

  quitBtn.addEventListener('click', quitGame);

  // D-Pad buttons for mobile
  gameDiv.querySelectorAll('.dpad-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const d = btn.getAttribute('data-dir');
      if (d === 'up' && dir.y === 0) nextDir = { x: 0, y: -1 };
      if (d === 'down' && dir.y === 0) nextDir = { x: 0, y: 1 };
      if (d === 'left' && dir.x === 0) nextDir = { x: -1, y: 0 };
      if (d === 'right' && dir.x === 0) nextDir = { x: 1, y: 0 };
      if (gameOver) restart();
    });
  });

  window.addEventListener('keydown', handleKey);
  loopId = setInterval(tick, 100);
  render();
}

function startTicTacToe() {
  if (currentGame) return;
  currentGame = 'ttt';

  const tttDiv = document.createElement('div');
  tttDiv.className = 'line';
  tttDiv.style.margin = '16px 0';
  tttDiv.innerHTML = `
    <div style="background:#161b22; border:2px solid #30363d; border-radius:6px; padding:12px; max-width:320px; margin:0 auto; box-shadow:0 0 15px rgba(126,231,135,0.15); text-align:center;">
      <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #30363d; padding-bottom:8px; margin-bottom:12px;">
        <span style="color:#7ee787; font-weight:bold;">🐾 INSTANT TIC-TAC-TOE</span>
        <button id="ttt-quit-btn" style="background:#21262d; border:1px solid #30363d; color:#8b949e; cursor:pointer; font-family:inherit; padding:2px 8px; font-size:16px; border-radius:4px;">[Q] QUIT</button>
      </div>
      <div id="ttt-status" style="margin-bottom:10px; color:#aff5b4; font-size:18px;">Your turn (you are 🐾)</div>
      <div style="display:grid; grid-template-columns:repeat(3, 1fr); gap:6px; width:210px; margin:0 auto;" id="ttt-grid">
        ${[0,1,2,3,4,5,6,7,8].map(i => `<button class="ttt-cell" data-idx="${i}" style="width:64px; height:64px; background:#0d1117; border:2px solid #30363d; color:#7ee787; font-size:30px; cursor:pointer; border-radius:4px; font-family:inherit; display:flex; align-items:center; justify-content:center;"></button>`).join('')}
      </div>
      <div style="margin-top:12px; font-size:16px; color:#8b949e;">
        You: <span id="ttt-win-u" style="color:#7ee787;">0</span> | Bot: <span id="ttt-win-b" style="color:#ff7b72;">0</span> | Draws: <span id="ttt-draws" style="color:#aff5b4;">0</span>
      </div>
      <button id="ttt-reset-btn" style="margin-top:10px; background:#21262d; border:1px solid #30363d; color:#7ee787; cursor:pointer; padding:4px 12px; font-family:inherit; font-size:16px; border-radius:4px;">Reset Board</button>
    </div>
  `;
  out.appendChild(tttDiv);
  window.scrollTo(0, document.body.scrollHeight);

  const statusEl = document.getElementById('ttt-status');
  const cells = tttDiv.querySelectorAll('.ttt-cell');
  const resetBtn = document.getElementById('ttt-reset-btn');
  const quitBtn = document.getElementById('ttt-quit-btn');
  const winUEl = document.getElementById('ttt-win-u');
  const winBEl = document.getElementById('ttt-win-b');
  const drawsEl = document.getElementById('ttt-draws');

  let board = Array(9).fill('');
  let winsU = 0, winsB = 0, draws = 0;
  let active = true;

  const lines = [
    [0,1,2], [3,4,5], [6,7,8],
    [0,3,6], [1,4,7], [2,5,8],
    [0,4,8], [2,4,6]
  ];

  function checkWin(b) {
    for (const [x,y,z] of lines) {
      if (b[x] && b[x] === b[y] && b[x] === b[z]) return b[x];
    }
    if (b.every(c => c)) return 'draw';
    return null;
  }

  function botMove() {
    if (!active) return;
    const empties = board.map((v, i) => v === '' ? i : null).filter(v => v !== null);
    if (!empties.length) return;

    // Check winning move, then block, then center, then corner, then random
    for (const mark of ['⚫', '🐾']) {
      for (const [x,y,z] of lines) {
        const vals = [board[x], board[y], board[z]];
        if (vals.filter(v => v === mark).length === 2 && vals.includes('')) {
          const idx = [x,y,z][vals.indexOf('')];
          playMove(idx, '⚫');
          return;
        }
      }
    }

    if (empties.includes(4)) { playMove(4, '⚫'); return; }
    const corners = [0, 2, 6, 8].filter(c => empties.includes(c));
    if (corners.length) { playMove(corners[Math.floor(Math.random() * corners.length)], '⚫'); return; }
    playMove(empties[Math.floor(Math.random() * empties.length)], '⚫');
  }

  function playMove(idx, mark) {
    board[idx] = mark;
    cells[idx].textContent = mark;
    cells[idx].style.cursor = 'default';

    const res = checkWin(board);
    if (res) {
      active = false;
      if (res === '🐾') {
        winsU++; winUEl.textContent = winsU;
        statusEl.innerHTML = '<span style="color:#7ee787;">🐾 YOU WON! (=^･ω･^=)</span>';
      } else if (res === '⚫') {
        winsB++; winBEl.textContent = winsB;
        statusEl.innerHTML = '<span style="color:#ff7b72;">⚫ Bot won! Rematch?</span>';
      } else {
        draws++; drawsEl.textContent = draws;
        statusEl.innerHTML = '<span style="color:#aff5b4;">Draw! Good game.</span>';
      }
      return;
    }

    if (mark === '🐾') {
      statusEl.textContent = 'Bot thinking...';
      setTimeout(botMove, 300);
    } else {
      statusEl.textContent = 'Your turn (you are 🐾)';
    }
  }

  cells.forEach(cell => {
    cell.addEventListener('click', (e) => {
      e.stopPropagation();
      const idx = parseInt(cell.getAttribute('data-idx'), 10);
      if (active && board[idx] === '') {
        playMove(idx, '🐾');
      }
    });
  });

  resetBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    board = Array(9).fill('');
    active = true;
    cells.forEach(c => { c.textContent = ''; c.style.cursor = 'pointer'; });
    statusEl.textContent = 'Your turn (you are 🐾)';
  });

  quitBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    currentGame = null;
    print('Tic-Tac-Toe closed. Back at terminal prompt.', 'dim');
    input.focus();
  });
}

// Auto-start game if URL hash is set (e.g. https://ali-hf.github.io#snake)
window.addEventListener('load', () => {
  if (window.location.hash === '#snake') {
    setTimeout(() => { if (commands.snake) commands.snake(); }, 1200);
  } else if (window.location.hash === '#ttt') {
    setTimeout(() => { if (commands.ttt) commands.ttt(); }, 1200);
  }
});

// matrix rain
let rainOn = false;
function startRain() {
  if (rainOn) return;
  rainOn = true;
  const c = document.getElementById('matrix');
  const ctx = c.getContext('2d');
  const chars = 'アイウエオカキクケコサシスセソ01{}<>/;';
  let cols, drops;
  function resize() { c.width = innerWidth; c.height = innerHeight; cols = Math.floor(c.width / 16); drops = Array(cols).fill(1); }
  resize(); addEventListener('resize', resize);
  setInterval(() => {
    if (!document.body.classList.contains('rain')) return;
    ctx.fillStyle = 'rgba(0,0,0,.08)'; ctx.fillRect(0, 0, c.width, c.height);
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--accent') || '#ff2a6d';
    ctx.font = '16px monospace';
    drops.forEach((y, i) => {
      ctx.fillText(chars[Math.floor(Math.random() * chars.length)], i * 16, y * 16);
      drops[i] = y * 16 > c.height && Math.random() > .975 ? 0 : y + 1;
    });
  }, 50);
}
